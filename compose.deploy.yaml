# Pull prebuilt Docker Hub images, with no local build required.
# Set DOCKERHUB_USERNAME in .env before deployment.
services:
  api:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/video-downloader-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - MAX_DURATION_SECONDS=${MAX_DURATION_SECONDS:-3600}
      - MAX_DOWNLOAD_MB=${MAX_DOWNLOAD_MB:-1024}
      - TWITTER_COOKIES=${TWITTER_COOKIES:-}
      - FRAME_ACCESS_TOKEN=${FRAME_ACCESS_TOKEN:-}
      - BILI_COOKIES=${BILI_COOKIES:-}
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/video-downloader-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80"
    depends_on:
      - api
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
