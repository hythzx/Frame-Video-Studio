services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - MAX_DURATION_SECONDS=${MAX_DURATION_SECONDS:-3600}
      - MAX_DOWNLOAD_MB=${MAX_DOWNLOAD_MB:-1024}
      - TWITTER_COOKIES=${TWITTER_COOKIES:-}
      - BILI_COOKIES=${BILI_COOKIES:-}
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80"
    depends_on:
      - api
    # nginx 官方镜像入口脚本需要 chown 缓存目录并以低权限用户运行 worker，
    # 在 cap_drop: ALL 下必须加回这四个能力，否则启动失败。
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
